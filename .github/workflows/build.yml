name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 打 v* 标签时需要创建 Release

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          sw_vers

      - name: Unit tests (also compiles the executable target)
        run: swift test

      - name: Assemble MicMonitor.app + zip
        run: bash scripts/build_app.sh

      - name: Upload MicMonitor.zip
        uses: actions/upload-artifact@v4
        with:
          name: MicMonitor-${{ github.ref_name }}
          path: MicMonitor.zip
          if-no-files-found: error
          retention-days: 30

      - name: Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MicMonitor.zip
          generate_release_notes: true
